{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-7">
      <div class="auth-card shadow-sm border-0 rounded-4">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <h2 class="fw-bold auth-title">Verify your email</h2>
            <p class="text-muted mb-0">Enter the 6-digit OTP sent to {{ user.email }}</p>
          </div>
          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-info rounded-3">{{ message }}</div>
            {% endfor %}
          {% endif %}
          <form method="post" novalidate>
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label fw-semibold" for="otp_code">OTP Code</label>
              <input type="text" class="form-control" id="otp_code" name="otp_code" maxlength="6" required>
            </div>
            <button type="submit" class="btn auth-btn w-100 text-white fw-semibold">Verify</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
